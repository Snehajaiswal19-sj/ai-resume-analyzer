<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Resume Analyzer{% endblock %}</title>
    <meta name="description" content="AI-powered resume analyzer - Get instant feedback, career predictions, and skill analysis">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-brain"></i>
                <span>Resume Analyzer</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/jd-match"><i class="fas fa-briefcase"></i> JD Match</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/compare"><i class="fas fa-balance-scale"></i> Compare</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/bulk-analyze-page"><i class="fas fa-layer-group"></i> Bulk</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/resume-builder"><i class="fas fa-pen-fancy"></i> Builder</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/templates"><i class="fas fa-file-alt"></i> Templates</a>
                    </li>
                    <li class="nav-item">
                        <button class="btn-toggle-mode" onclick="toggleDarkMode()" title="Toggle Dark Mode" id="themeToggle">
                            <i class="fas fa-moon" id="darkModeIcon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-1"><strong>AI Resume Analyzer</strong></p>
            <small class="text-muted">© 2024 · Made with <i class="fas fa-heart" style="color: #A65D4E;"></i></small>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <script>
    // Dark mode toggle with smooth transition
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const icon = document.getElementById('darkModeIcon');
        
        if (document.body.classList.contains('dark-mode')) {
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
            localStorage.setItem('darkMode', 'enabled');
            document.documentElement.style.colorScheme = 'dark';
        } else {
            icon.classList.remove('fa-sun');
            icon.classList.add('fa-moon');
            localStorage.setItem('darkMode', 'disabled');
            document.documentElement.style.colorScheme = 'light';
        }
        
        // Refresh charts if function exists
        if (typeof window.refreshCharts === 'function') {
            setTimeout(() => window.refreshCharts(), 100);
        }
    }

    // Check saved preference on page load
    (function() {
        const savedMode = localStorage.getItem('darkMode');
        if (savedMode === 'enabled') {
            document.body.classList.add('dark-mode');
            const icon = document.getElementById('darkModeIcon');
            if (icon) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
            document.documentElement.style.colorScheme = 'dark';
        } else {
            document.documentElement.style.colorScheme = 'light';
        }
    })();
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
